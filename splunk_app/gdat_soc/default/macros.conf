# Macros base. Equivalen a funciones KQL guardadas.

[gdat_win_security]
definition = index=gdat_win (sourcetype=gdat:win:security OR sourcetype=XmlWinEventLog)
iseval = 0

[gdat_normalizar_cuenta(1)]
args = campo
# Quita "DOMINIO\" y "@dominio" y pasa a minúsculas (iff/split del KQL).
# Ojo: en una macro con argumentos el "$" está reservado; por eso "@.*" va sin ancla final.
definition = lower(replace(replace($campo$, "^.*\\\\", ""), "@.*", ""))
iseval = 0

[gdat_host_corto(1)]
args = campo
definition = lower(mvindex(split($campo$, "."), 0))
iseval = 0

[gdat_ip_privada(1)]
args = ip
# Mismos rangos que ipv4_is_private() de KQL
definition = (cidrmatch("10.0.0.0/8", $ip$) OR cidrmatch("172.16.0.0/12", $ip$) OR cidrmatch("192.168.0.0/16", $ip$))
iseval = 0

[gdat_umbral_recursos]
# let umbral = 5 de la regla 05
definition = 5
iseval = 0

[gdat_registrar_alerta(4)]
args = regla, severidad, mitre, tactica
# Equivale a SecurityAlert: cada resultado de una regla se guarda en gdat_alertas.
# Los argumentos se pasan sin comillas y sin comas dentro (las comas separan argumentos).
definition = eval regla="$regla$", severidad="$severidad$", mitre="$mitre$", tactica="$tactica$" | collect index=gdat_alertas
iseval = 0
