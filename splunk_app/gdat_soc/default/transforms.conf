# Extracciones de XmlWinEventLog (fase 8). Ver la estrofa [XmlWinEventLog] de props.conf.

[gdat_xml_eventcode]
REGEX = <EventID[^>]*>(\d+)</EventID>
FORMAT = EventCode::$1

[gdat_xml_computer]
REGEX = <Computer>([^<]+)</Computer>
FORMAT = Computer::$1

[gdat_xml_eventdata]
# <Data Name='TargetUserName'>valor</Data> → TargetUserName=valor
REGEX = <Data Name=['"]([^'"]+)['"]>([^<]*)</Data>
FORMAT = $1::$2
MV_ADD = true

[gdat_xml_host]
# En indexación: host = <Computer>, como hace el TA
DEST_KEY = MetaData:Host
REGEX = <Computer>([^<]+)</Computer>
FORMAT = host::$1
