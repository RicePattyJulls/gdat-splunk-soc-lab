# Índices del laboratorio. Equivalen a las tablas de Log Analytics.
# Tamaño limitado: es un lab con licencia Trial de 500 MB/día.

[gdat_web]
# NovaShop real (AppServiceConsoleLogs)
homePath   = $SPLUNK_DB/gdat_web/db
coldPath   = $SPLUNK_DB/gdat_web/colddb
thawedPath = $SPLUNK_DB/gdat_web/thaweddb
maxTotalDataSizeMB = 2048

[gdat_win]
# Eventos de seguridad de Windows (SecurityEvent)
homePath   = $SPLUNK_DB/gdat_win/db
coldPath   = $SPLUNK_DB/gdat_win/colddb
thawedPath = $SPLUNK_DB/gdat_win/thaweddb
maxTotalDataSizeMB = 2048

[gdat_cloud]
# StorageBlobLogs y AzureActivity
homePath   = $SPLUNK_DB/gdat_cloud/db
coldPath   = $SPLUNK_DB/gdat_cloud/colddb
thawedPath = $SPLUNK_DB/gdat_cloud/thaweddb
maxTotalDataSizeMB = 2048

[gdat_alertas]
# Resultado de las 7 reglas (SecurityAlert)
homePath   = $SPLUNK_DB/gdat_alertas/db
coldPath   = $SPLUNK_DB/gdat_alertas/colddb
thawedPath = $SPLUNK_DB/gdat_alertas/thaweddb
maxTotalDataSizeMB = 512
# Buckets pequeños: el valor por defecto (750 MB) no cabe en un índice de 512 MB
maxDataSize = 100

[gdat_riesgo]
# Eventos de riesgo del RBA ligero (índice risk de Splunk ES)
homePath   = $SPLUNK_DB/gdat_riesgo/db
coldPath   = $SPLUNK_DB/gdat_riesgo/colddb
thawedPath = $SPLUNK_DB/gdat_riesgo/thaweddb
maxTotalDataSizeMB = 512
# Buckets pequeños: el valor por defecto (750 MB) no cabe en un índice de 512 MB
maxDataSize = 100
