# Todo llega por HEC como JSON: un evento por petición y hora en el campo "time".
# KV_MODE = json extrae en búsqueda; no se usa INDEXED_EXTRACTIONS para no duplicar campos.

[novashop:json]
# Logging driver "splunk" de Docker: la línea de stdout llega en el campo "line"
KV_MODE = json
SHOULD_LINEMERGE = false

[gdat:win:security]
# Sintético, con los nombres de campo nativos de Windows (EventCode, TargetUserName…)
KV_MODE = json
SHOULD_LINEMERGE = false

[gdat:azure:storageblob]
KV_MODE = json
SHOULD_LINEMERGE = false

[gdat:azure:activity]
KV_MODE = json
SHOULD_LINEMERGE = false

[XmlWinEventLog]
# Fase 8: datos reales de splunk/attack_data. Equivalente mínimo de Splunk_TA_windows:
# los campos se llaman igual que con el TA (EventCode, Computer, TargetUserName...).
# Si algún día se instala el TA, quitar esta estrofa para no duplicar extracciones.
# Un evento por bloque <Event ...>; dentro de Properties puede haber saltos de línea.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=<Event xmlns)
TRUNCATE = 100000
TIME_PREFIX = <TimeCreated SystemTime=['"]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC
KV_MODE = none
REPORT-gdat_xml = gdat_xml_eventcode, gdat_xml_computer, gdat_xml_eventdata
TRANSFORMS-gdat_xml_host = gdat_xml_host
