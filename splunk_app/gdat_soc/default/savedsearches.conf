[GDAT 04 - Exfiltracion a Storage]
description = Subida de blobs autenticada con clave de cuenta desde una IP que no es de administracion. El lookup gdat_mapa_ip_host traduce la IP publica de salida al host del lab, para que la alerta comparta la entidad Host con las del endpoint. MITRE T1567.002. Origen: gdat-azure-sentinel-lab/biceps/queries/04-exfiltracion-storage.kql
search = index=gdat_cloud sourcetype=gdat:azure:storageblob OperationName=PutBlob AuthenticationType=AccountKey StatusCode=201 \
| eval IPOrigen=mvindex(split(CallerIpAddress, ":"), 0) \
| lookup gdat_ips_admin.csv ip AS IPOrigen OUTPUT ip AS es_admin \
| where isnull(es_admin) \
| stats count AS Subidas sum(RequestBodySize) AS Bytes values(Uri) AS Ficheros min(_time) AS Inicio max(_time) AS Fin by IPOrigen AuthenticationType \
| eval Ficheros=mvindex(Ficheros, 0, 9) \
| eval HostAfectado="gdatstorage" \
| lookup gdat_mapa_ip_host.csv ip AS IPOrigen OUTPUT host AS HostOrigen \
| eval _time=Fin \
| `gdat_registrar_alerta(GDAT 04 - Exfiltracion a Storage, high, T1567.002, Exfiltration)`
