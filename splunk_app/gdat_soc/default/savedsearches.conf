[GDAT 01 - SQL injection en NovaShop]
description = Patron de inyeccion SQL registrado por la propia aplicacion en su log de seguridad. Filtra por la firma y no por el resultado, para incluir los tanteos que acaban en database_error. MITRE T1190. Origen: gdat-azure-sentinel-lab/biceps/queries/01-sqli-novashop.kql
search = index=gdat_web sourcetype=novashop:json "novashop_security" \
| spath input=line \
| search kind=novashop_security event_type=product_search signature_match=true \
| eval IPOrigen=client_ip, Termino=search_term, Resultado=outcome \
| eval CuentaNormalizada=lower(if(isnull(user) OR user="" OR user="null", "anonimo", user)) \
| eval HostAfectado="novashop" \
| table _time IPOrigen CuentaNormalizada HostAfectado Termino Resultado request_id \
| `gdat_registrar_alerta(GDAT 01 - SQL injection en NovaShop, high, T1190, InitialAccess)`
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -7m@m
dispatch.latest_time = -2m@m
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.track = 1
alert.digest_mode = 1
alert.suppress = 0
request.ui_dispatch_app = gdat_soc
request.ui_dispatch_view = search

[GDAT 02 - Kerberoasting]
description = Peticion de ticket de servicio con cifrado RC4 (0x17) contra una cuenta con SPN. Por si sola no prueba el ataque: hay sistemas antiguos que siguen pidiendo RC4. MITRE T1558.003. Origen: gdat-azure-sentinel-lab/biceps/queries/02-kerberoasting.kql
search = `gdat_win_security` EventCode=4769 \
| where NOT like(ServiceName, "%$") AND lower(ServiceName)!="krbtgt" \
| where TicketEncryptionType="0x17" \
| eval IPOrigen=replace(IpAddress, "^::ffff:", "") \
| eval CuentaNormalizada=`gdat_normalizar_cuenta(TargetUserName)` \
| eval HostCorto=`gdat_host_corto(Computer)` \
| table _time HostCorto Computer CuentaNormalizada ServiceName IPOrigen TicketEncryptionType \
| `gdat_registrar_alerta(GDAT 02 - Kerberoasting, high, T1558.003, CredentialAccess)`
