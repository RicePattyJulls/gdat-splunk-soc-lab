[GDAT 05 - Creacion sospechosa de recursos]
description = Una identidad crea o modifica 5 o mas recursos distintos en una hora. Tecnica secundaria T1078.004 (cuentas cloud). Ojo: endswith de KQL no distingue mayusculas y like() de SPL si, por eso el lower(). MITRE T1578.002. Origen: gdat-azure-sentinel-lab/biceps/queries/05-creacion-recursos.kql
search = index=gdat_cloud sourcetype=gdat:azure:activity ActivityStatusValue=Success \
| where like(lower(OperationNameValue), "%/write") \
| eval CuentaNormalizada=lower(mvindex(split(Caller, "@"), 0)), IPOrigen=CallerIpAddress \
| stats dc(ResourceId) AS Recursos count AS Operaciones values(OperationNameValue) AS Ejemplos max(_time) AS Ultimo by CuentaNormalizada IPOrigen \
| where Recursos >= `gdat_umbral_recursos` \
| eval _time=Ultimo, mitre_secundaria="T1078.004" \
| `gdat_registrar_alerta(GDAT 05 - Creacion sospechosa de recursos, medium, T1578.002, DefenseEvasion)`
