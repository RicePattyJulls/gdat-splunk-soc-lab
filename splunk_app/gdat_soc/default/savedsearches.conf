[GDAT RBA 00 - Eventos de riesgo]
description = Convierte cada alerta nueva de gdat_alertas en eventos de riesgo por entidad (indice risk de Splunk ES). High 80, medium 40.
search = index=gdat_alertas _index_earliest=-6m@m _index_latest=-1m@m \
| eval risk_score=case(severidad="high", 80, severidad="medium", 40, true(), 20) \
| eval HostEntidad=coalesce(HostCorto, HostOrigen, HostAfectado) \
| eval obj=mvappend(if(isnotnull(CuentaNormalizada) AND CuentaNormalizada!="anonimo", "user|".CuentaNormalizada, null()), if(isnotnull(MiembroAnadido), "user|".MiembroAnadido, null()), if(isnotnull(IPOrigen) AND IPOrigen!="", "ip|".IPOrigen, null()), if(isnotnull(HostEntidad), "system|".HostEntidad, null())) \
| mvexpand obj \
| eval risk_object_type=mvindex(split(obj, "|"), 0), risk_object=mvindex(split(obj, "|"), 1), risk_message=regla \
| table _time risk_object risk_object_type risk_score risk_message regla mitre tactica \
| collect index=gdat_riesgo
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
request.ui_dispatch_app = gdat_soc
request.ui_dispatch_view = search

[GDAT RBA 01 - Umbral de riesgo]
description = El incidente del lab: una entidad suma 100 puntos o mas con 2 o mas tecnicas MITRE en 24 h.
search = index=gdat_riesgo \
| stats sum(risk_score) AS puntuacion dc(mitre) AS tecnicas values(mitre) AS mitre values(regla) AS reglas min(_time) AS inicio max(_time) AS fin by risk_object risk_object_type \
| where puntuacion>=100 AND tecnicas>=2 \
| eval inicio=strftime(inicio, "%F %T"), fin=strftime(fin, "%F %T") \
| sort - puntuacion
enableSched = 1
cron_schedule = */5 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = risk_object
alert.suppress.period = 24h
request.ui_dispatch_app = gdat_soc
request.ui_dispatch_view = search

[GDAT COR - Entidades compartidas]
description = Informe: entidades (cuenta, IP, host) que aparecen en mas de una regla. Traduccion de la consulta de correlacion de la fase 10 de GDAT.
search = index=gdat_alertas \
| eval HostEntidad=coalesce(HostCorto, HostOrigen, HostAfectado) \
| eval entidad=mvappend(if(isnotnull(CuentaNormalizada) AND CuentaNormalizada!="anonimo", "Account:".CuentaNormalizada, null()), if(isnotnull(MiembroAnadido), "Account:".MiembroAnadido, null()), if(isnotnull(IPOrigen) AND IPOrigen!="", "IP:".IPOrigen, null()), if(isnotnull(HostEntidad), "Host:".HostEntidad, null())) \
| mvexpand entidad \
| stats dc(regla) AS NumReglas values(regla) AS Alertas min(_time) AS Inicio max(_time) AS Fin by entidad \
| where NumReglas > 1 \
| eval Inicio=strftime(Inicio, "%F %T"), Fin=strftime(Fin, "%F %T") \
| sort entidad
dispatch.earliest_time = -24h
dispatch.latest_time = now
request.ui_dispatch_app = gdat_soc
request.ui_dispatch_view = search

[GDAT COR - Linea de tiempo]
description = Informe: la cadena de ataque ordenada en el tiempo (union de la fase 10 de GDAT).
search = (`gdat_win_security` EventCode IN (4624, 4662, 4688, 4728, 4769)) OR (index=gdat_cloud sourcetype=gdat:azure:storageblob OperationName=PutBlob) OR (index=gdat_web "candidate_injection_executed") \
| eval Fuente=case(index="gdat_win", "SecurityEvent", index="gdat_cloud", "StorageBlobLogs", index="gdat_web", "NovaShop") \
| eval Detalle=case(Fuente="SecurityEvent", EventCode." ".coalesce(TargetUserName, SubjectUserName)." ".coalesce(CommandLine, ServiceName, MemberName, IpAddress, ""), Fuente="StorageBlobLogs", OperationName." ".Uri." desde ".CallerIpAddress, true(), "SQLi ejecutada") \
| eval host=if(Fuente="NovaShop", "novashop", host) \
| table _time Fuente host Detalle \
| sort 0 _time
dispatch.earliest_time = -24h
dispatch.latest_time = now
request.ui_dispatch_app = gdat_soc
request.ui_dispatch_view = search
